name: Release

# 出**可分发产物**：Windows / Linux / macOS 三平台各编一份，压成压缩包挂到 Release。
# 与 ci.yml 的分工：ci.yml 负责"改错了没有"（fmt/clippy/test/MSRV），
# 本文件负责"能不能拿去用"（release 二进制 + 压缩包）。
#
# ── 三条来自 ci.yml 的既有约定，这里照做 ────────────────────────────────
#
# 1. **Rust job 必须先拿到 `web/dist`**。`static_files.rs` 用 `#[derive(RustEmbed)]`
#    在**编译期**把前端产物读进二进制，而 `web/dist` 不入库 —— 干净 checkout 里没有它，
#    编译会直接失败（`folder '.../web/dist' does not exist`）。
#    所以 `web` job 先跑、把 dist 当 artifact 传下来，三个平台各自取用，
#    前端**只构建一次**（不必每平台重跑一遍 npm）。
#
# 2. **工具链钉具体版本**（1.91.1），不用 `@stable`：见 ci.yml 里那段长注释 ——
#    `-D warnings` 下跨 rustc 版本会突然冒出新的 lint，漂版本等于"本地绿、CI 红"。
#
# 3. **`--locked`**：Cargo.lock 入库，锁死依赖版本，产物可复现。
#
# ── 为什么三平台都能编（TLS 的选择直接决定了这件事）─────────────────────
#
# 本仓**只用 `native-tls`**（兼容性优先：rustls 不实现 CBC 套件，连不上只给
# 老套件的主机）。副作用是各平台都走**系统 TLS**，于是不需要随包带 OpenSSL：
#   * Windows  → SChannel（系统自带，零额外依赖）
#   * macOS    → Security.framework（系统自带）
#   * Linux    → OpenSSL（**需要 libssl-dev + pkg-config**，故下面有 apt 那一步）
# 若哪天改回 `rustls-tls`，这一步可以删，但会重新引入"老主机连不上"。
#
# ── 压缩选型 ────────────────────────────────────────────────────────────
#
# 两个二进制之间有大段重复代码，**xz 的大窗口正好吃得下**：同一份产物
# gzip 3.51 MiB / xz 1.89 MiB（实测，见仓库 docs）。所以 unix 侧两种都给；
# Windows 的 runner 上没有 xz，只出 zip。

on:
  # 打 tag 就发版（产物挂到 GitHub Release）
  push:
    tags: ['v*']
  # 手动跑：只出 artifact，不发 Release
  workflow_dispatch:

# 默认**最小权限**：只有发 Release 的那个 job 才需要写。
# 之前把 `contents: write` 写在顶层，等于让 `web` / `build` 两个 job（要跑 npm ci、
# 下载依赖、执行编译）也都白拿写权限 —— 权限应该贴着真正需要它的那一步放。
permissions:
  contents: read

# 同一 tag 重复触发时只保留最后一次（Actions 按分钟计费）
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # ── 前端：构建一次，dist 传给三个平台 ────────────────────────────────────
  web:
    name: 前端（产出 web/dist）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json

      # `web/.npmrc` 已随 Vue 依赖删除：lite 的 devDependencies 之间没有 peer 冲突，
      # `npm ci` 按 lock 直接可复现，不需要 legacy-peer-deps 这类绕行开关
      - name: 安装依赖
        run: npm ci

      # 发布产物也要过类型检查：release 不该是"唯一没验过的那条路"
      - name: 类型检查
        run: npm run typecheck

      - name: 构建
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: ${{ github.workspace }}/web/dist
          retention-days: 1
          if-no-files-found: error

  # ── 三平台 release 构建 + 打包 ──────────────────────────────────────────
  build:
    name: ${{ matrix.name }}
    needs: web
    runs-on: ${{ matrix.os }}
    strategy:
      # 一个平台挂了也要看到另外两个的结果 —— 跨平台问题常常只挂在某一个平台上
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: Linux x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: Windows x86_64
          - os: macos-14
            target: aarch64-apple-darwin
            name: macOS arm64
    steps:
      - uses: actions/checkout@v4

      - name: 取回 web/dist
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: ${{ github.workspace }}/web/dist

      - name: 安装工具链
        uses: dtolnay/rust-toolchain@1.91.1

      - uses: Swatinem/rust-cache@v2

      # Linux 上 native-tls 走 OpenSSL，需要头文件与 pkg-config。
      # 若哪天改用 rustls，这一步可以删。
      - name: 安装系统依赖（仅 Linux）
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config

      - name: 编译（release，两个二进制）
        run: cargo build --release --locked --bins --target ${{ matrix.target }}

      # 版本号：打 tag 时用 tag（去掉 v），手动跑时读 workspace 版本
      - name: 计算版本与包名
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            # ⚠ git tag 允许斜杠（`v1/2` 之类），而 VERSION 会被拼进文件名与目录名
            # （`mcloud-v<VERSION>-<target>/`）⇒ 斜杠会让后面每一步的路径都错位。
            # 在这里**早失败**，而不是等打包时报一堆看不懂的路径错误。
            if [[ "$VERSION" == */* || "$VERSION" == *" "* ]]; then
              echo "::error::tag 名不能含 '/' 或空格（当前 '${GITHUB_REF_NAME}'）——它会拼进产物文件名"
              exit 1
            fi
          else
            VERSION="$(sed -n '/\[workspace.package\]/,/^\[/p' Cargo.toml | sed -n 's/^version = "\(.*\)"/\1/p' | head -1)"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "PKG=mcloud-v${VERSION}-${{ matrix.target }}" >> "$GITHUB_ENV"

      # ── 压缩二进制：**只有 Linux 与 Windows** ────────────────────────────
      #
      # 用户口径（2026-09-29）：linux/windows 可以压二进制，macos 不用压。
      # macOS **不压不是漏了**：UPX 不支持 arm64 Mach-O，而且压缩后的 Mach-O
      # 会破坏代码签名，本机执行直接弹"无法验证开发者" —— 白赚体积、丢掉可运行性。
      #
      # 两条都要的验证：`upx -t` 是 UPX 自带的完整性测试；再跑一次 `--help`
      # 确认压完**还能执行**（UPX 压坏二进制的表现就是加载即崩）。
      - name: 压缩二进制（仅 Linux）
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y upx-ucl
          BIN="target/${{ matrix.target }}/release"
          upx --best --lzma "$BIN/mcloud-server" "$BIN/mcloud-cli"
          upx -t "$BIN/mcloud-server" "$BIN/mcloud-cli"
          "$BIN/mcloud-cli" --help 2>&1 | grep -q "用法" && echo "冒烟：CLI 压完仍可执行"
          ls -l "$BIN/mcloud-server" "$BIN/mcloud-cli"

      - name: 压缩二进制（仅 Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install upx -y --no-progress
          $bin = "target/${{ matrix.target }}/release"
          upx --best --lzma "$bin/mcloud-server.exe" "$bin/mcloud-cli.exe"
          upx -t "$bin/mcloud-server.exe" "$bin/mcloud-cli.exe"
          $out = & "$bin/mcloud-cli.exe" --help 2>&1 | Out-String
          if ($out -notmatch "用法") { throw "冒烟失败：CLI 压完跑不起来：$out" }
          Write-Host "冒烟：CLI 压完仍可执行"
          Get-ChildItem "$bin/*.exe" | Select-Object Name, Length
          # ⚠⚠ 必须显式清零退出码：`--help` 是**未知子命令**，CLI 打印用法后退出非 0，
          # 而 runner 的 pwsh 包装会在脚本末尾 `exit $LASTEXITCODE` —— 于是**整步判失败**，
          # 尽管打包、upx -t、冒烟全都成功了（实测踩过：Linux 那步因为管道取的是 grep
          # 的状态才侥幸没事，Windows 没有管道所以原样漏出来）。
          $LASTEXITCODE = 0

      # macOS 侧**不加** UPX（UPX 不支持 arm64 Mach-O，压过会破坏代码签名，
      # 用户实测"m 芯片上压缩就运行不了"）—— 但"没压"不等于"能跑"，
      # 所以这里补一条冒烟：确认未压缩的 arm64 二进制确实可执行。
      - name: 冒烟（仅 macOS：确认未压缩的 arm64 二进制可执行）
        if: runner.os == 'macOS'
        run: |
          BIN="target/${{ matrix.target }}/release"
          "$BIN/mcloud-cli" --help 2>&1 | grep -q "用法" && echo "冒烟：macOS arm64 二进制可执行（未压缩）"

      - name: 打包（unix：tar.gz + tar.xz）
        if: runner.os != 'Windows'
        shell: bash
        run: |
          BIN_DIR="target/${{ matrix.target }}/release"
          mkdir -p "target/dist/${PKG}"
          cp "$BIN_DIR/mcloud-server" "$BIN_DIR/mcloud-cli" "target/dist/${PKG}/"
          cd target/dist
          tar -czf "${PKG}.tar.gz" "${PKG}"
          echo "gzip: $(ls -l "${PKG}.tar.gz" | awk '{print $5}') B"
          if command -v xz >/dev/null; then
            tar -cJf "${PKG}.tar.xz" "${PKG}"
            echo "xz:   $(ls -l "${PKG}.tar.xz" | awk '{print $5}') B"
          fi
          shasum -a 256 *.tar.* > "${PKG}.sha256" || sha256sum *.tar.* > "${PKG}.sha256"
          cat "${PKG}.sha256"

      - name: 打包（Windows：zip）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bin = "target/${{ matrix.target }}/release"
          New-Item -ItemType Directory -Force -Path "target/dist/$env:PKG" | Out-Null
          Copy-Item "$bin/mcloud-server.exe", "$bin/mcloud-cli.exe" "target/dist/$env:PKG/"
          Compress-Archive -Path "target/dist/$env:PKG" -DestinationPath "target/dist/$env:PKG.zip"
          Get-FileHash "target/dist/$env:PKG.zip" -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  $env:PKG.zip" } | Out-File "target/dist/$env:PKG.sha256"

      # ⚠ 上传前把**未打包的原始二进制目录**删掉：`path: target/dist/*` 会把它
      # 和压缩包一起收进去，Linux/macOS 各白搭约 7MB 下载量（实测 artifact 8.6MB
      # 而压缩包只有 2.9MB）。
      # 踩过的坑：这步一开始被插到 **web job** 里（那个 upload-artifact 缩进相同、
      # 是文件里第一个），于是 PKG 未定义、等于空跑，artifact 体积一点没变 ——
      # 所以这里锚点必须带 `name: ${{ matrix.target }}` 才落到 build job。
      - name: 只保留压缩包与校验和
        shell: bash
        run: rm -rf "target/dist/${PKG}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ github.workspace }}/target/dist/*
          if-no-files-found: error

  # ── 打 tag 时把三个平台的包挂到 Release ────────────────────────────────
  release:
    name: 发布
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    # 写权限**只给这一步**（顶层是 contents: read）——发 Release 才需要它
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 列出待发布文件
        run: ls -l dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            三平台产物（Linux x86_64 / Windows x86_64 / macOS arm64），每包附 `.sha256`，
            包内两个可执行文件：`mcloud-server`（服务本体）+ `mcloud-cli`（命令行）。
            完整说明见仓库 [`docs/usage.md`](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/docs/usage.md)。

            ## 快速开始

            ```bash
            tar -xJf mcloud-<版本>-<你的平台>.tar.xz          # Windows 用 Expand-Archive 解 .zip
            ./mcloud-server                                   # 没有子命令，直接跑
            ```

            然后打开 <http://127.0.0.1:3000> —— **首次运行**进「创建管理员」向导。
            数据在运行目录下的 `data/`；端口与数据目录用 `MCLOUD_ADDR` / `MCLOUD_DATA_DIR`
            （⚠ 是 `MCLOUD_DATA_DIR` 不是 `MCLOUD_DATA`；`PORT` 会被忽略）。

            ## 平台注意

            * **Linux**：用系统 TLS，需要 `libssl`（`apt install libssl3` / `dnf install openssl-libs`）；
            * **macOS**：产物**未压缩**（UPX 会破坏 arm64 代码签名，M 芯片上跑不起来）。
              二进制未签名，浏览器下载后先 `xattr -dr com.apple.quarantine ./mcloud-server ./mcloud-cli`；
            * **Windows**：产物**用 UPX 压过**（约原体积 1/3），代价是 Defender/SmartScreen
              **可能误报** —— 走「更多信息 → 仍要运行」或加白名单；介意就从源码构建。

            ⚠ `mcloud-cli` 与 `mcloud-server` **共用同一个数据目录**（同目录运行，或给同一个
            `MCLOUD_DATA_DIR`），否则 CLI 看不到服务里配好的账号。
