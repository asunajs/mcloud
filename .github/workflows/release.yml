name: Release

# 出**可分发产物**：四个目标各编一份，压成压缩包挂到 Release。
# 与 ci.yml 的分工：ci.yml 负责"改错了没有"（fmt/clippy/test/MSRV），
# 本文件负责"能不能拿去用"（release 二进制 + 压缩包），并在**发版前再跑一次门禁**
# （打 tag 是直接 push，没有 PR 那道把关 ⇒ 这里是最后一道）。
#
# ── 用户口径（2026-10-02）────────────────────────────────────────────────
#
# 1. **只发一个二进制 `mcloud`**。2026-10-03 起 CLI 与服务**已合并进同一个二进制**
#    （原来是 `mcloud-server` + `mcloud-cli` 两个；合并只多 116 KB，却省掉一整个
#     3.12 MB 的二进制）⇒ 分发规则是**不带参数 = 起服务、带子命令 = CLI**。
#    所以这里既不是"只发服务"也不是"两个都发"，而是**只有一个**，它两件事都会。
# 2. **一个平台只出一种压缩包** —— 不再 unix 侧同时给 tar.gz + tar.xz。
#    unix 一律 `tar.gz`（通用性最好：GNU tar / BSD tar / Windows 自带的 bsdtar 都能解），
#    Windows 用 `zip`。每包附一个 `.sha256`。
#    ⚠ 代价说清：xz 比 gzip 小约 45%（仓库实测 3.51 → 1.89 MiB，那是**两个**二进制的数，
#    现在只有一个 server，绝对值更小）。要换 xz 就改「打包（unix）」那一步。
# 3. 四个目标：**Windows x86_64 / Linux x86_64 / Linux x86_64（静态 musl）/
#    Linux arm64 / macOS arm64**。
#
#    ⚠ 那个 **musl** 目标是 2026-10-06 加的（用户实测：`./mcloud` 在 Linux 上报
#    `libc.so.6: version GLIBC_2.39 not found` ✗）。
#    根因不是"编错了"，而是**在 `ubuntu-latest`（= 24.04）上编**：动态链 glibc 与
#    系统 OpenSSL ⇒ 产物的下限就被抬到"glibc ≥ 2.39 + libssl3"（`docs/usage.md` 里
#    原先就是**这么写的** —— 也就是说"拷一个二进制就能跑"这个承诺，x86_64 那份从来
#    没兑现过 ✗）。musl 那份**静态**链一切（含 vendored OpenSSL）⇒ 任何 Linux x86_64
#    都能跑，CentOS 7 / Debian 11 这类老发行版也一样 ✓。
#    ⚠ 它与 gnu 那份**并存**（不是替换）：gnu 那份更小、用系统 TLS；要"拷过去就能跑"
#    就下 musl 那份 ✓。
#
# ── 三条来自 ci.yml 的既有约定，这里照做 ────────────────────────────────
#
# 1. **Rust job 必须先拿到 `web/dist`**。`static_files.rs` 用 `#[derive(RustEmbed)]`
#    在**编译期**把前端产物读进二进制，而 `web/dist` 不入库 —— 干净 checkout 里没有它，
#    编译会直接失败（`folder '.../web/dist' does not exist`）。
#    所以 `web` job 先跑、把 dist 当 artifact 传下来，四个目标各自取用，
#    前端**只构建一次**（不必每平台重跑一遍 npm）。
#
# 2. **工具链钉具体版本**（1.91.1），不用 `@stable`：见 ci.yml 里那段长注释 ——
#    `-D warnings` 下跨 rustc 版本会突然冒出新的 lint，漂版本等于"本地绿、CI 红"。
#
# 3. **`--locked`**：Cargo.lock 入库，锁死依赖版本，产物可复现。
#
# ── Linux arm64 为什么走 `cross`，以及它为什么要 `vendored` OpenSSL ──────
#
# 本仓**只用 `native-tls`**（兼容性优先：rustls 不实现 CBC 套件，连不上只给老套件的主机）
# ⇒ Linux 侧链接 OpenSSL ⇒ 交叉编 aarch64 时必须拿到**目标架构**的 OpenSSL。
#
# ⚠ 光装 `gcc-aarch64-linux-gnu` 不够（openssl-sys 走 pkg-config，找的是目标架构的 .pc）；
#   而 `cross` 的镜像里那份又**太老**：cross 最后发布的 v0.2.5（2023-02）用的还是
#   Ubuntu 16.04 ⇒ 只有 OpenSSL 1.0.2g，低于 openssl-sys 要求的 1.1.0。
#   （Dockerfile 升到 Ubuntu 24.04 是 2026-05-31，**在最后一次发布之后** ⇒ 只有未发布的
#   `:main`/`:edge` 镜像才是新的；而那个会把 glibc 基线从 2.23 抬到 2.39，产物反而
#   **更不兼容**旧发行版 ✗。）
#
# ⇒ 解法在依赖侧，不在 workflow 侧：给 `aarch64-unknown-linux-gnu` 开 openssl 的
#   `vendored`（见 `crates/mcloud-upstream/Cargo.toml` 末尾那段），用目标架构的交叉
#   工具链**从源码编 OpenSSL**。好处是不依赖镜像里那份过期库，也不去追未发布镜像。
#   代价：arm64 产物**静态链** OpenSSL（运行时不需要装 `libssl`，体积大 2–3 MB）。
#
# ⚠ 另一条路是 GitHub 的 arm64 runner（`ubuntu-24.04-arm`），但**本仓是私有仓库** ⇒
#    那条要额外计费 ⇒ 用 cross。
# ⚠ cross 那条**本地验不了**（本机没有 Docker）⇒ 它只在 CI 真跑时才算验证过。
#    验证方式：`gh workflow run release.yml --ref main`（手动触发不发 Release，
#    只出 artifact —— 见 release job 的 `if: github.ref_type == 'tag'`）。
#
# ── 压缩选型（UPX）────────────────────────────────────────────────────
#
# **只有 Linux 与 Windows** 压二进制。macOS **不压不是漏了**：UPX 不支持 arm64 Mach-O，
# 而且压缩后的 Mach-O 会破坏代码签名，本机执行直接弹"无法验证开发者" —— 白赚体积、
# 丢掉可运行性。
#
# ── 冒烟：真起服务、真打接口 ────────────────────────────────────────────
#
# ⚠ 冒烟**不能只跑 `--help`**：`mcloud` 不带参数就是**起服务**（合并后的规则），而
#   冒烟要验的正是"这份产物起得来、能服务"。所以这里拿一个临时数据目录 + 一个空闲端口
#   把它**真跑起来**，
# 轮询 `/api/health`（不需要登录），通了才算过，然后杀掉。
# ⚠ Linux arm64 是交叉编出来的 aarch64 二进制，x86 runner 上**跑不了** ⇒ 那一条跳过冒烟
#    （"没验"不等于"验过了"，跳过在日志里是看得见的）。

on:
  # 打 tag 就发版（产物挂到 GitHub Release）
  push:
    tags: ['v*']
  # 手动跑：只出 artifact，不发 Release
  workflow_dispatch:

# 默认**最小权限**：只有发 Release 的那个 job 才需要写。
# 之前把 `contents: write` 写在顶层，等于让 `web` / `build` 两个 job（要跑 npm ci、
# 下载依赖、执行编译）也都白拿写权限 —— 权限应该贴着真正需要它的那一步放。
permissions:
  contents: read

# 同一 tag 重复触发时只保留最后一次（Actions 按分钟计费）
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # ── 前端：构建一次，dist 传给后面每个 job ──────────────────────────────
  web:
    name: 前端（产出 web/dist）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json

      # `web/.npmrc` 已随 Vue 依赖删除：lite（现为 git 依赖 `@asunajs/lite`）的
      # devDependencies 之间没有 peer 冲突，
      # `npm ci` 按 lock 直接可复现，不需要 legacy-peer-deps 这类绕行开关
      - name: 安装依赖
        run: npm ci

      # 发布产物也要过类型检查：release 不该是"唯一没验过的那条路"
      - name: 类型检查
        run: npm run typecheck

      - name: 构建
        run: npm run build

      # ⚠ 要无头 Chrome 的那 7 条（交互三个认证态 / 大体量 / 搜索框 / 窄屏 / 泄漏量测）
      #   ubuntu runner 上没有 ⇒ 它们是**本地**的门：
      #   提交档 `node scripts/gates-web.mjs`、推送前 `node scripts/gates-web.mjs --push`。
      # ⚠ 2026-10-07 起 lite 的编译期负例**不在这里**了：框架剥离到 `asunajs/lite`，
      #   那条门跑在框架仓的 CI 里（见 `docs/web/lite.md`）。

      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: ${{ github.workspace }}/web/dist
          retention-days: 1
          if-no-files-found: error

  # ── 门禁：发版前再跑一次 fmt / clippy / test ───────────────────────────
  #
  # 为什么 release 里也要跑：打 tag 是**直接 push**，没有 PR 那道把关，而 ci.yml 只在
  # PR 与手动触发时跑 ⇒ 不加这一道，tag 就成了"唯一没验过的那条路"。
  # 代价是一次 tag ≈ 8–10 分钟 runner 时间，换"不会发出去一个编得过、跑不过的包"。
  gates:
    name: 门禁（fmt / clippy / test）
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 取回 web/dist
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: ${{ github.workspace }}/web/dist

      - name: 安装工具链
        uses: dtolnay/rust-toolchain@1.91.1
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: 安装系统依赖（native-tls → OpenSSL）
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config

      - name: 格式检查
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: 测试
        run: cargo test --workspace --locked

  # ── 四个目标：release 构建 + 冒烟 + 打包 ────────────────────────────────
  build:
    name: ${{ matrix.name }}
    needs: [web, gates]
    runs-on: ${{ matrix.os }}
    strategy:
      # 一个平台挂了也要看到另外三个的结果 —— 跨平台问题常常只挂在某一个平台上
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: Linux x86_64
            cross: false
          # ⚠ 静态那条（见文件头第 3 条）：`cross: true` 是因为它要 musl 工具链，
          # 而 cross 镜像自带 ✓ —— 但它**能在这台 x86_64 runner 上原生跑** ⇒
          # 下面的冒烟**不跳**它（判据写在冒烟那步的 `if` 里 ✓）。
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            name: Linux x86_64（静态，任意发行版）
            cross: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            name: Linux arm64
            cross: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: Windows x86_64
            cross: false
          - os: macos-14
            name: macOS arm64
            cross: false
    steps:
      - uses: actions/checkout@v4

      - name: 取回 web/dist
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: ${{ github.workspace }}/web/dist

      - name: 安装工具链
        uses: dtolnay/rust-toolchain@1.91.1

      # cross 只装在需要它的那两条矩阵上（装它要几十秒，别的平台白装没意义）
      - name: 安装 cross（Linux arm64 / Linux musl）
        if: matrix.cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - uses: Swatinem/rust-cache@v2
        with:
          # 交叉那条与原生那条的产物不通用，分开缓存别互相污染
          key: ${{ matrix.target }}

      # 原生 Linux 上 native-tls 走 OpenSSL，需要头文件与 pkg-config。
      # ⚠ 交叉那条**不要**装：cross 镜像里自带目标的 sysroot 与 -sys 依赖，
      #   装了反而可能把 x86 的 pkg-config 结果喂给 aarch64 编译。
      - name: 安装系统依赖（仅原生 Linux）
        if: runner.os == 'Linux' && !matrix.cross
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config

      # ── 编译：**只编 server**（用户口径 2026-10-02）────────────────────
      - name: 编译（原生）
        if: ${{ !matrix.cross }}
        run: cargo build --release --locked --bin mcloud --target ${{ matrix.target }}

      - name: 编译（交叉：Linux arm64 / Linux musl）
        if: matrix.cross
        run: cross build --release --locked --bin mcloud --target ${{ matrix.target }}

      # 版本号：打 tag 时用 tag（去掉 v），手动跑时读 workspace 版本
      - name: 计算版本与包名
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            # ⚠ git tag 允许斜杠（`v1/2` 之类），而 VERSION 会被拼进文件名与目录名
            # （`mcloud-v<VERSION>-<target>/`）⇒ 斜杠会让后面每一步的路径都错位。
            # 在这里**早失败**，而不是等打包时报一堆看不懂的路径错误。
            if [[ "$VERSION" == */* || "$VERSION" == *" "* ]]; then
              echo "::error::tag 名不能含 '/' 或空格（当前 '${GITHUB_REF_NAME}'）——它会拼进产物文件名"
              exit 1
            fi
          else
            VERSION="$(sed -n '/\[workspace.package\]/,/^\[/p' Cargo.toml | sed -n 's/^version = "\(.*\)"/\1/p' | head -1)"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "PKG=mcloud-v${VERSION}-${{ matrix.target }}" >> "$GITHUB_ENV"
          echo "BIN_DIR=target/${{ matrix.target }}/release" >> "$GITHUB_ENV"

      # ── 校验 musl 那份**真的静态** ──────────────────────────────────────
      #
      # ⚠ 这一步是 musl 那份的**全部卖点**所在：静态 ⇒ 不依赖 glibc / libssl ⇒
      #   拷到任何 Linux x86_64 都能跑 ✓（2026-10-06 用户实测的
      #   `GLIBC_2.39 not found` 就是这条不成立时的样子 ✗）。
      #   不查的话，"静态"就只是嘴上说的 —— 而它错了的症状**只会在别人的机器上出现** ✗。
      #
      # ⚠⚠ 必须放在 UPX **之前**：压过的二进制 `ldd` 读到的是 UPX 存根，结论不可信 ✗。
      # ⚠ `ldd` 对静态可执行会**非零退出**（"not a dynamic executable"）⇒ 不能拿退出码判，
      #   要判它的**输出** ✓。
      - name: 校验静态链接（仅 musl）
        if: matrix.target == 'x86_64-unknown-linux-musl'
        shell: bash
        run: |
          ldd "$BIN_DIR/mcloud" 2>&1 || true
          if ! ldd "$BIN_DIR/mcloud" 2>&1 | grep -qE "not a dynamic executable|statically linked"; then
            echo "::error::musl 产物不是静态链接 ⇒ 拷到老发行版上照样跑不起来（这正是它要解决的问题）"
            exit 1
          fi
          echo "✓ 静态链接（无 glibc / libssl 依赖）"

      # ── 压缩二进制：**只有 Linux 与 Windows** ────────────────────────────
      #
      # ⚠⚠ 这里的条件**不能**带 `!matrix.cross`：UPX 只是压缩、**不执行**目标文件 ⇒
      #   交叉编出来的 aarch64 一样能压。2026-10-03 第一次发 rc.1 就是这里写错了
      #   （把"冒烟不能跑交叉产物"和"UPX 不能压交叉产物"混成了一件事）：
      #   x86_64 二进制 1.9 MB、arm64 却是 **10 MB**，同一个 Release 里差 5 倍。
      #   判断"压没压过"最快的一条：`file` 的判定 —— 压过的会显示
      #   `statically linked, no section header`（UPX 存根），没压的是普通 ELF。
      #
      # 两条都要的验证：`upx -t` 是 UPX 自带的完整性测试（它是解压后比对，同样不执行
      # 目标文件 ⇒ 交叉产物也验得了）；随后那条**真冒烟**确认压完**还能跑起来、还能服务**
      # （UPX 压坏二进制的表现就是加载即崩）—— 冒烟那条**只有原生**跑得了。
      - name: 压缩二进制（Linux，含交叉编的 arm64）
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y upx-ucl
          upx --best --lzma "$BIN_DIR/mcloud"
          upx -t "$BIN_DIR/mcloud"
          ls -l "$BIN_DIR/mcloud"

      - name: 压缩二进制（仅 Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install upx -y --no-progress
          upx --best --lzma "$env:BIN_DIR/mcloud.exe"
          upx -t "$env:BIN_DIR/mcloud.exe"
          Get-ChildItem "$env:BIN_DIR/mcloud.exe" | Select-Object Name, Length

      # ── 冒烟：真起服务、真打 /api/health ────────────────────────────────
      #
      # ⚠ 不带参数就是起服务（合并后的规则：不带参数 = 服务、带子命令 = CLI）
      #   ⇒ 冒烟就照服务跑，别指望它打印用法。
      # ⚠ 交叉编出来的 aarch64 二进制在 x86 runner 上跑不了 ⇒ 那一条由 `if` 跳过。
      # ⚠⚠ 但 **musl x86_64 那条要跑**：它同样是"交叉编"（cross 提供 musl 工具链 ✓），
      #   产物却是 x86_64 ⇒ 在这台 runner 上原生跑得起来 ✓。跳过它等于把
      #   "静态二进制真能起服务"这件事**唯一能自动验的机会**扔掉 ✗
      #   （aarch64 那条至今只验到"编得出、打得出包"，没验到"跑得起来" ✓）。
      - name: 冒烟（unix：起服务 + /api/health）
        if: runner.os != 'Windows' && (!matrix.cross || matrix.target == 'x86_64-unknown-linux-musl')
        shell: bash
        run: |
          export MCLOUD_ADDR=127.0.0.1:39123
          export MCLOUD_DATA_DIR="$(mktemp -d)"
          "$BIN_DIR/mcloud" &
          PID=$!
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS --max-time 2 http://127.0.0.1:39123/api/health >/dev/null 2>&1; then ok=1; break; fi
            sleep 1
          done
          kill "$PID" 2>/dev/null || true
          wait "$PID" 2>/dev/null || true
          if [ "$ok" != 1 ]; then
            echo "::error::冒烟失败：二进制起来了但 /api/health 一直不通"
            exit 1
          fi
          echo "冒烟通过：二进制能起、/api/health 通（压缩后 ✓）"

      - name: 冒烟（Windows：起服务 + /api/health）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:MCLOUD_ADDR = "127.0.0.1:39123"
          $env:MCLOUD_DATA_DIR = Join-Path $env:RUNNER_TEMP "mcloud-smoke"
          New-Item -ItemType Directory -Force -Path $env:MCLOUD_DATA_DIR | Out-Null
          $p = Start-Process -FilePath "$env:BIN_DIR/mcloud.exe" -PassThru -NoNewWindow
          $ok = $false
          for ($i = 0; $i -lt 30; $i++) {
            try {
              Invoke-WebRequest -Uri "http://127.0.0.1:39123/api/health" -TimeoutSec 2 -UseBasicParsing | Out-Null
              $ok = $true; break
            } catch { Start-Sleep -Seconds 1 }
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { throw "冒烟失败：二进制起来了但 /api/health 一直不通" }
          Write-Host "冒烟通过：二进制能起、/api/health 通（压缩后 ✓）"

      # ── 打包：**一个平台一种格式** ──────────────────────────────────────
      #
      # unix → tar.gz；Windows → zip。各附一个 .sha256。
      # 包内**只有** `mcloud` 一个文件（CLI + 服务已合并，见文件头第 1 条）。
      - name: 打包（unix：tar.gz）
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p "target/dist/${PKG}"
          cp "$BIN_DIR/mcloud" "target/dist/${PKG}/"
          cd target/dist
          tar -czf "${PKG}.tar.gz" "${PKG}"
          echo "包大小: $(ls -l "${PKG}.tar.gz" | awk '{print $5}') B"
          shasum -a 256 "${PKG}.tar.gz" > "${PKG}.sha256" || sha256sum "${PKG}.tar.gz" > "${PKG}.sha256"
          cat "${PKG}.sha256"

      - name: 打包（Windows：zip）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "target/dist/$env:PKG" | Out-Null
          Copy-Item "$env:BIN_DIR/mcloud.exe" "target/dist/$env:PKG/"
          Compress-Archive -Path "target/dist/$env:PKG" -DestinationPath "target/dist/$env:PKG.zip"
          Get-FileHash "target/dist/$env:PKG.zip" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $env:PKG.zip" } |
            Out-File -Encoding ascii "target/dist/$env:PKG.sha256"
          Get-Content "target/dist/$env:PKG.sha256"

      # ⚠ 上传前把**未打包的原始二进制目录**删掉：`path: target/dist/*` 会把它
      # 和压缩包一起收进去，白搭好几 MB 下载量。
      # 踩过的坑：这步一开始被插到 **web job** 里（那个 upload-artifact 缩进相同、
      # 是文件里第一个），于是 PKG 未定义、等于空跑 —— 所以这里锚点必须带
      # `name: ${{ matrix.target }}` 才落到 build job。
      - name: 只保留压缩包与校验和
        shell: bash
        run: rm -rf "target/dist/${PKG}"

      - uses: actions/upload-artifact@v4
        with:
          # ⚠ 前缀 `pkg-` 是**必须**的：release job 用 `pattern: 'pkg-*'` 只取平台包，
          # 而 `web-dist` 这个 artifact（前端产物，给 rust-embed 用的）不能混进去 ——
          # 2026-10-03 第一次发 rc.1 就是这么漏的：release job 的 download-artifact
          # 默认把**所有** artifact 都拉下来，于是 Release 里多出 `index.html`
          # 与 `index.html.gz` 两个不该发布的前端文件。
          name: pkg-${{ matrix.target }}
          path: ${{ github.workspace }}/target/dist/*
          if-no-files-found: error

  # ── 打 tag 时把四个目标的包挂到 Release ────────────────────────────────
  release:
    name: 发布
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    # 写权限**只给这一步**（顶层是 contents: read）——发 Release 才需要它
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          # 只取平台包（`pkg-<target>`）—— 不写 pattern 的话，`web-dist` 也会被拉进来，
          # 于是 `index.html` / `index.html.gz` 混进 Release（2026-10-03 首次发 rc.1 实测）。
          pattern: pkg-*
          path: dist
          merge-multiple: true

      - name: 列出待发布文件
        run: ls -l dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          # RC / beta 这类**带连字符**的 tag 自动标成 pre-release，正式版（`v3.0.0`）不标。
          # 写死 true/false 都不行：那会让"以后那个正式版"或"以后的 RC"其中一边标错。
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: docs/releases/${{ github.ref_name }}.md
          # ⚠ 发布说明是**手写**的（`docs/releases/v<版本>.md` ✓）——
          #   不自动从提交记录生成：那是给开发者看的，用户看不懂 ✗（2026-10-11 用户口径）。