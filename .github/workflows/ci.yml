name: CI

# 七项门禁（docs/dev-gates.md「七条门禁」一节）的自动化版本。
#
# 与本地 `scripts/gates.sh` 跑的是**同一组命令**，一致性是刻意的。
#
# ── 它保证什么、不保证什么（别把它当成第二道独立的防线）────────────
#
# **保证**：这个工作流一旦跑了，任何人都能在 Actions 页面上看到结果 ——
#   公开仓库里这是一份**对外可核**的证据，本地 hook 给不了这个。
#
# **不保证**：它从未在真实 runner 上验证过，所以它**可能因为环境差异失败**，
#   而且失败时没人能立刻判断是代码问题还是配置问题。
#   同理，它**不覆盖**本地 hook 漏掉的情况：两边跑同一组命令，
#   同一组命令重复执行不构成两次独立的检查。
#
# 换句话说：本地那道闸（.githooks/）是**日常的**，这里这道是**对外的**，
# 两者职责不同，不是"兜底"关系 —— "兜底"意味着覆盖率更宽，而这里并不更宽。
#
# 首次出现失败时，按 docs/dev-gates.md 的"跨环境"一节排查，
# 修完请把结论写回那一节，别让下一个人重查一遍。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # 依赖没变时跳过重复编译，CI 时间主要花在这里
  RUSTFLAGS: -D warnings

jobs:
  gates:
    name: 七项门禁
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: 缓存 cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: 安装 Node（标识守卫 / 黄金向量需要）
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # ── 1/7 单元测试 ──────────────────────────────────────────
      - name: cargo test
        run: cargo test --workspace

      # ── 2/7 静态检查 ─────────────────────────────────────────
      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      # ── 3/7 格式 ─────────────────────────────────────────────
      - name: cargo fmt
        run: cargo fmt --check

      # ── 4/7 分层铁律 ─────────────────────────────────────────
      # 断言纯层（core/upstream/capabilities/exec）不含 reqwest/rusqlite
      # 且不依赖 mcloud-io，同时断言组装根 mcloud-server 必须依赖 io。
      - name: 分层铁律
        run: bash scripts/check-deps.sh

      # ── 5/7 文件命名 ─────────────────────────────────────────
      # 非 Rust 文件一律 kebab-case（详见 docs/repo-layout.md）。
      # 编号与 gates.sh 的 ORDER 保持一致 —— 两边对不上时，
      # 看 CI 红的人会去本地跑错那一条。
      - name: 文件命名
        run: bash scripts/check-filenames.sh

      # ── 6/7 标识守卫 ─────────────────────────────────────────
      # 扫源码字面量与 base64 解码后的载荷，断言进版本库的标识都是 199 合成号段。
      - name: 标识守卫
        run: node scripts/check-identifiers.cjs

      # ── 7/7 黄金向量 ─────────────────────────────────────────
      # 用 Node crypto 独立实现算一遍 test/golden/*.json，与 Rust 侧互为交叉验证；
      # 同时对每个 golden 文件做脱敏扫描（Rust 只扫 include_str! 进来的那些）。
      - name: 黄金向量
        run: node scripts/check-golden-vectors.cjs

