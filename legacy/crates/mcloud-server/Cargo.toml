[package]
name = "mcloud-server"
description = "mcloud HTTP 服务：axum 路由 + SSE + OpenAPI + 内嵌前端产物。（P0 骨架）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
mcloud-core = { workspace = true }
mcloud-io = { workspace = true }
mcloud-exec = { workspace = true }
mcloud-capabilities = { workspace = true }
# 组装层：迁移策略、能力注册表 JSON、登录驱动都住在那里，
# 这样 CLI 不必依赖本 crate（也就不会把 axum 拖进命令行产物）
mcloud-app = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
# 事件流（SSE）的响应体需要一个 `Stream`：见 workspace 里那条注释
tokio-stream = { workspace = true }
tracing = { workspace = true }
axum = { workspace = true }
tower-http = { workspace = true }
chrono = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
tempfile = "3"
# 路由测试直接喂请求给 Router（`oneshot`），不起真实端口、不占端口号
tower = { version = "0.5", features = ["util"] }
