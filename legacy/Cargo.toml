[workspace]
resolver = "3"
members = [
  "crates/mcloud-core",
  "crates/mcloud-upstream",
  "crates/mcloud-capabilities",
  "crates/mcloud-io",
  "crates/mcloud-exec",
  "crates/mcloud-app",
  "crates/mcloud-server",
  "crates/mcloud-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
# MSRV：edition 2024 需要 1.85+；本项目用到的 trait 内 async fn / LazyLock 等均早于该版本。
# 本地统一用 stable 通道（见 rust-toolchain.toml），以免触发工具链下载。
rust-version = "1.91"
license = "Apache-2.0"
authors = ["catlair"]
repository = "https://github.com/catlair/mcloud"

[workspace.dependencies]
# --- 内部 crate ---
mcloud-core = { path = "crates/mcloud-core" }
mcloud-upstream = { path = "crates/mcloud-upstream" }
mcloud-capabilities = { path = "crates/mcloud-capabilities" }
mcloud-io = { path = "crates/mcloud-io" }
mcloud-exec = { path = "crates/mcloud-exec" }
mcloud-app = { path = "crates/mcloud-app" }
mcloud-server = { path = "crates/mcloud-server" }

# --- 序列化 / 错误 ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"

# --- 异步 / 运行时 ---
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "time", "sync", "signal"] }
# SSE 的 HTTP 侧要一个 `Stream`，而 axum 只**收**不收（它不重导出 `futures_core`）。
# `ReceiverStream` 把 `tokio::sync::mpsc` 的接收端包成流，是这件事最短的一条路，
# 也让"事件流由谁生产"在类型上看得见：一个 channel，一端是 pump 任务，一端是响应体。
tokio-stream = { version = "0.1", features = ["sync"] }

# --- HTTP / 存储 ---
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "json",
  "gzip",
  "brotli",
  "deflate",
  "cookies",
] }
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }

# --- HTTP 服务（**只在 mcloud-server**）---
# 依赖方向门禁会挡住 `mcloud-cli -> mcloud-server`，所以这几个库进不了命令行产物。
# tower-http 的 fs 用于把前端产物当静态资源发；cors/trace/compression 等到真需要时再加，
# 现在写上去就是没人读的配置。
axum = "0.8"
tower-http = { version = "0.6", features = ["fs"] }

# --- 时间 / ID / 日志 ---
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# --- CLI ---
clap = { version = "4", features = ["derive"] }

# --- 密码学（RustCrypto 全家桶，纯 Rust，不依赖 OpenSSL）---
# 放在 mcloud-core 而不是 mcloud-io：签名/DES/RSA 是纯计算，
# 而 mcloud-upstream 必须能在不引入 reqwest 的前提下调用它们（见 docs/rust-rewrite-plan.md §3.2）。
md-5 = "0.10"
sha2 = "0.10"
# PC 客户端 encryptByHash 用的是 SHA-1（fetion.com.cn: + 口令），不是 SHA-256
sha1 = "0.10"
hmac = "0.12"
aes = "0.8"
cbc = "0.1"
des = "0.8"
cipher = "0.4"
rsa = "0.9"
flate2 = "1"

# --- 编码 ---
base64 = "0.22"
hex = "0.4"

# --- 口令哈希 ---
# 自建用户体系的口令存储：argon2id（默认参数 m=19456/t=2/p=1）。
# 纯计算、无 IO，所以归 mcloud-core；盐由 `Random` trait 注入而不是用它自带的随机源。
argon2 = "0.5"

# --- 随机（io 层的 SystemRandom 用 OsRng；版本与 rsa 依赖的 rand_core 对齐）---
rand = "0.8"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
# 重写期间开发迭代为主：依赖不优化、调试信息全开
opt-level = 0
debug = 1
