[package]
name = "mcloud-cli"
description = "mcloud 命令行工具（与原 CLI 对等）+ fixture 抽取子命令"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "mcloud"
path = "src/main.rs"

[dependencies]
mcloud-core = { workspace = true }
mcloud-capabilities = { workspace = true }
mcloud-upstream = { workspace = true }
# **刻意不依赖 mcloud-server**：后者是 HTTP 产物，拖进来等于让命令行工具
# 连带拿到 axum/路由/静态资源那一整套。这条约束由 scripts/check-deps.sh 断言。
mcloud-app = { workspace = true }
mcloud-io = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
chrono = { workspace = true }
base64 = { workspace = true }
# 终端里把二维码画出来（扫码登录的主要交互方式）。
# `svg` feature 是为了 `--qr-out` 落一张图片：终端字符画对字体太敏感，
# 一旦等宽没对齐就扫不出来，而扫码这一步失败的表现是"用户以为程序坏了"。
qrcode = { version = "0.14", features = ["svg"] }
# 口令与验证码只从标准输入读、且**不回显**：命令行参数会进 shell 历史与 ps 输出
rpassword = "7"

[dev-dependencies]
tempfile = "3"
