[package]
name = "mcloud-tasks"
description = "各自动化任务的业务编排"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
mcloud-core.workspace = true
mcloud-engine.workspace = true
# 任务要用会话层的错误语义（90001 的判据与措辞），不自己再实现一份。
mcloud-upstream.workspace = true
# 登录要生成 sID / 短信 random（`Random` trait 与 `SeqRandom` 替身都在这里）。
mcloud-crypto.workspace = true
async-trait.workspace = true
# 口令收集要**并发**跑两个来源（WS 弹幕听满一段 + 小红书一次 GET）：
# 串行的话总耗时是 `60s + 1s`，而其中 60 秒里网络是空闲的。
# 只用 `join!`，不需要 runtime（那是 `mcloud-server` 的事）。
futures.workspace = true
serde.workspace = true
# ⚠ 2026-10-02 补：`exchange.rs` 那条线用了 `tracing::warn!` 而本 crate 没有这个依赖，
# 编译直接红（`use of unresolved module or unlinked crate tracing`）⇒ 挡住的却是
# 别人那条线的验证。依赖与 `mcloud-engine` 保持一致（同一份 workspace 版本）。
tracing.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# ⚠ 只有这一条任务要"等一会儿"（任务拓展凑完备份要等服务端记账，20 秒是判据的一部分）。
# 等待写成字段、测试里设 0 ⇒ 真 sleep 只出现在生产路径。
tokio = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
# 登录测试要手工构造 AES-ECB 密文（模拟上游成功响应）与顺序随机源。
mcloud-core = { workspace = true, features = ["testkit"] }
# 异步测试（`#[tokio::test]`）。
tokio = { workspace = true, features = ["macros", "rt"] }
aes.workspace = true
hex.workspace = true
