[package]
name = "mcloud-server"
description = "HTTP 服务：axum 路由 + SSE 事件流；同时提供 CLI 入口"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "mcloud-server"
path = "src/main.rs"

[[bin]]
name = "mcloud-cli"
path = "src/bin/cli.rs"

[dependencies]
mcloud-core.workspace = true
mcloud-app.workspace = true
mcloud-engine.workspace = true
axum.workspace = true
tower-http.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
rust-embed.workspace = true
mime_guess.workspace = true

[dev-dependencies]
# 路由级测试：`oneshot` 直接打 Router，不真的起监听端口。
# 这样测试不依赖端口分配，也不会与正在跑的服务抢 8080。
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
mcloud-store.workspace = true
mcloud-core = { workspace = true, features = ["testkit"] }

[lints]
workspace = true
