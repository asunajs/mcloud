[package]
name = "mcloud-server"
description = "mcloud 的库与唯一入口：HTTP 服务（axum 路由 + SSE + 内嵌前端）与 CLI 同一个二进制"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# ⚠ **只有一个 bin**（2026-10-03 用户口径：「合并为一个，以后就叫 mcloud」）。
#
# 原先这里是两个：`mcloud-server`（`src/main.rs`）与 `mcloud-cli`（`src/bin/cli.rs`）。
# 实测（同源码、同 release profile）4.05 MB + 3.12 MB = 7.17 MB，合并后 **4.16 MB**
# ——只多 116 KB（CLI 独有的代码），省掉一整个二进制，而且交付形态变成
# "拷一个二进制就能跑" ✓。分发规则见 `src/main.rs`：**无参数 = 起服务、有子命令 = CLI**。
#
# ⚠ 名字必须显式写出来：不写 `[[bin]]` 的话名字会取 **package 名**（`mcloud-server`）✗。
[[bin]]
name = "mcloud"
path = "src/main.rs"

[dependencies]
mcloud-core.workspace = true
mcloud-app.workspace = true
mcloud-crypto.workspace = true
uuid.workspace = true
chrono.workspace = true
mcloud-engine.workspace = true
mcloud-tasks.workspace = true
mcloud-upstream.workspace = true
axum.workspace = true
tower-http.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
rust-embed.workspace = true
mime_guess.workspace = true
qrcode.workspace = true
base64.workspace = true

[dev-dependencies]
# 路由级测试：`oneshot` 直接打 Router，不真的起监听端口。
# 这样测试不依赖端口分配，也不会与正在跑的服务抢 8080。
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
mcloud-store.workspace = true
mcloud-core = { workspace = true, features = ["testkit"] }

[lints]
workspace = true
