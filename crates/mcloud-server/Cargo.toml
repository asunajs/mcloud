[package]
name = "mcloud-server"
description = "mcloud 的库与唯一入口：HTTP 服务（axum 路由 + SSE + 内嵌前端）与 CLI 同一个二进制"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# ⚠ **只有一个 bin**（2026-10-03 用户口径：「合并为一个，以后就叫 mcloud」）。
#
# 原先这里是两个：`mcloud-server`（`src/main.rs`）与 `mcloud-cli`（`src/bin/cli.rs`）。
# 实测（同源码、同 release profile）4.05 MB + 3.12 MB = 7.17 MB，合并后 **4.16 MB**
# ——只多 116 KB（CLI 独有的代码），省掉一整个二进制，而且交付形态变成
# "拷一个二进制就能跑" ✓。分发规则见 `src/main.rs`：**无参数 = 起服务、有子命令 = CLI**。
#
# ⚠ 名字必须显式写出来：不写 `[[bin]]` 的话名字会取 **package 名**（`mcloud-server`）✗。
[[bin]]
name = "mcloud"
path = "src/main.rs"

[dependencies]
mcloud-core.workspace = true
mcloud-app.workspace = true
mcloud-crypto.workspace = true
uuid.workspace = true
chrono.workspace = true
mcloud-engine.workspace = true
mcloud-tasks.workspace = true
mcloud-upstream.workspace = true
axum.workspace = true
tower-http.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
rust-embed.workspace = true
mime_guess.workspace = true
qrcode.workspace = true
base64.workspace = true
# `limit`：并发上限（`ConcurrencyLimitLayer`）—— 把"一次能同时跑多少个 handler"
# 钉成一个常数，理由见 `lib.rs` 里那一层的注释 ✓。
# `util`：`ServiceExt` —— 生产路径用不到，但**测试**要用（`oneshot` 直接打 Router，
# 不真的起监听端口，也不与正在跑的服务抢 :3000 ✓）。放在 [dependencies] 里
# 一份就够：dev 目标同样看得见 ✓。
tower = { version = "0.5", features = ["util", "limit"] }

[dev-dependencies]
http-body-util = "0.1"
mcloud-store.workspace = true
mcloud-core = { workspace = true, features = ["testkit"] }
# 集成测试要**自己实现 `HttpClient`**（那是个 async trait ✓）—— 面板行为（登录 ✓）
# 的验收明确要求"用假 HTTP 客户端断言发了几枪" ✓，而生产路径用不到它 ⇒ 放 dev ✓
# （与上面 `tower` 那条"dev 目标同样看得见"同一条口径 ✓）。
async-trait.workspace = true

[lints]
workspace = true
