[package]
name = "mcloud-capabilities"
description = "mcloud 能力层：19 个能力 + 声明式注册表 + FieldSpec。禁止 IO。"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
mcloud-core = { workspace = true }
mcloud-upstream = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# 登录状态机要判"二维码过期了吗" —— 时间一律从 `Clock` 注入，本层不读系统时钟
chrono = { workspace = true }
# 拼 `auth`（`base64("pc:<account>:<authToken>")`）是纯计算
base64 = { workspace = true }

[dev-dependencies]
# 只为跑 async 单测：纯层不允许依赖 mcloud-io，所以测试用假 HttpClient + 内存脚本
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
