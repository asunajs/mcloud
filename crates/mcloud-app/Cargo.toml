[package]
name = "mcloud-app"
description = "组装层：把 IO 实现注入 engine，供 CLI 与 server 共用"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
mcloud-core.workspace = true
mcloud-crypto.workspace = true
mcloud-engine.workspace = true
mcloud-tasks.workspace = true
mcloud-store.workspace = true
mcloud-upstream.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
# 推送地址的安全闸用它解析主机：**必须与 reqwest 同一把尺子**，
# 否则两套解析的差异就是一条 SSRF 绕过（见 `push::validate_push_url` ✓）。
url.workspace = true
# ⚠ `net` 是给推送地址闸的第二层用的：`push::SystemResolver` 要
# `tokio::net::lookup_host`（把 OS 的 `getaddrinfo` 异步化）✓。
# 之前是靠别的 crate（server / reqwest）把 `net` 传递着打开的 ——
# 蹭传递特性太脆：哪天那条依赖没了，这里就编不过 ✗ ⇒ 显式声明 ✓。
tokio = { workspace = true, features = ["net"] }
tracing.workspace = true
anyhow.workspace = true

[dev-dependencies]
# 复用 core 的测试替身（FixedClock）。见 conventions §8.3。
mcloud-core = { workspace = true, features = ["testkit"] }

[lints]
workspace = true
