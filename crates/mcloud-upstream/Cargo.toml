[package]
name = "mcloud-upstream"
description = "移动云盘上游接口封装（端点、请求/响应类型、HTTP 客户端）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
mcloud-core.workspace = true
mcloud-crypto.workspace = true
uuid.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
# 直播口令提取要**逐字**复刻原 TS 的一批正则（`live_kouling.rs`）。
# ⚠ 选 `regex`（RE2 风格、线性时间）而不是回溯型引擎：原 TS 里那条前瞻正则
# 在这里改成了显式扫描，所以**不需要**回溯能力 —— 不需要就不引入。
regex.workspace = true
reqwest.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio.workspace = true
# 直播弹幕的 WebSocket 客户端（`live_ws_client.rs`）：只用 `connect_async` + `Message`，
# TLS 走 rustls（与 reqwest 同源，不引入 openssl）。
tokio-tungstenite.workspace = true
# `tokio-tungstenite` 的流实现 `Stream`/`Sink`，取 `next()` / `send()`
# 要 `futures` 的扩展 trait。
# ⚠ 复用**已有的** workspace 依赖（`mcloud-server` 早就在用），
# 所以这一行**不新增任何 crate**（`futures` 及 `futures-util` 已在 lock 里）。
# 不手写 poll 垫片的理由：那要反复摆弄 `Pin`/`Context`，正是 `unsafe` 最爱的角落，
# 而本仓 `unsafe_code = "forbid"` —— 能用成熟实现就不自己造。
futures.workspace = true
# 十六进制编解码：登录链路的设备指纹（`login.rs`）在生产代码里就要用，
# 只放 dev-dependencies 编译不过。
hex.workspace = true
# MD5：`member/apply` 的两个签名头要对**任意字节**求摘要（设备串解码后的
# 48 字节里有 `0x83` 这种非 UTF-8 序列），而 `mcloud_crypto::md5_hex` 只收 `&str`
# —— 走它要先经过一次 UTF-8 转换，而那对这批字节是**有损**的。
md-5.workspace = true

[lints]
workspace = true

[dev-dependencies]
# 登录测试要手工构造 AES-ECB 密文，验证解密器（生产代码不需要直接用它）。
aes.workspace = true
hex.workspace = true
# 固定时钟：`live_ws_client` 的听写测试要钉住时间戳（状态机用 `now_millis`
# 派生三处字段，用真实时钟就没法断言）。
mcloud-core = { workspace = true, features = ["testkit"] }

# ── 交叉编 Linux arm64 时的 OpenSSL ──────────────────────────────────────
#
# Linux 上 `native-tls` 走**系统 OpenSSL** ⇒ `openssl-sys` 必须找到**目标架构**的
# 头文件与库。原生构建（x86_64 Linux / macOS / Windows）用系统那份就行 ✓，
# 但 **cross 交叉编 aarch64 时不行**：cross 最后发布的 v0.2.5（2023-02）用的镜像
# 还是 Ubuntu 16.04，里面只有 OpenSSL **1.0.2g**，而 `openssl-sys` 0.9.115 要求
# ≥ 1.1.0 ⇒
#
#     version_number=1000207f
#     This crate is only compatible with OpenSSL (version 1.1.0, 1.1.1, 3.x, or 4.x) …
#     Process completed with exit code 101.
#
# （2026-10-02 发 3.0.0-rc.1 时实测两轮：第一轮是"完全找不到"，按 cross 官方
#  `docs/recipes.md` 的 pre-build 装了 `libssl-dev:arm64` 之后，变成"找到了但太老"。）
#
# 官方文档给的另一条路就是这里用的 `vendored`：**从源码编 OpenSSL**，用目标架构的
# 交叉工具链（cross 会设好 `CC_aarch64_unknown_linux_gnu` 等）。两条好处：
#   1. 不依赖镜像里那份过期 OpenSSL ✓；
#   2. 也**不去追未发布的 `:main` 镜像** —— 那个已升到 Ubuntu 24.04，会把 glibc 基线
#      从 2.23 抬到 2.39，产物反而**更不兼容**旧发行版 ✗。
#
# 代价说清：arm64 这份产物**静态链** OpenSSL（运行时不再需要装 `libssl` ✓，
# 代价是二进制约大 2–3 MB —— 反正后面还有 UPX ✓）；x86_64 那份照旧动态链系统
# `libssl` ✓。两边差异在 Release 说明里写明了。
#
# ⚠ 只挂 `aarch64-unknown-linux-gnu`：**别**改成 `cfg(target_os = "linux")` ——
#   那会让本来好好的 x86_64 也去源码编一遍 OpenSSL（每次构建多约 4 分钟 ✗），
#   换来的只是"少装一个 libssl" ✓。
[target.aarch64-unknown-linux-gnu.dependencies]
openssl = { version = "0.10", features = ["vendored"] }
