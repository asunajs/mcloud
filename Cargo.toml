[workspace]
resolver = "2"
members = [
    "crates/mcloud-core",
    "crates/mcloud-crypto",
    "crates/mcloud-upstream",
    "crates/mcloud-engine",
    "crates/mcloud-tasks",
    "crates/mcloud-store",
    "crates/mcloud-app",
    "crates/mcloud-server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
# 真实下界是 1.88，不是原先写的 1.82。
#
# 1.82 这个值从一开始就是错的，而且没人发现：日常开发用 stable（1.91），
# 声明的版本纯粹是个装饰。实测（rustup run <ver> cargo check --locked）：
#
#   1.82 / 1.85 / 1.86  → 失败
#   1.88                → 通过
#
# 卡住的是间接依赖：cookie_store@0.22.1 与 icu_*@2.3.0 都要求 rustc 1.88
# （cookie_store 经 reqwest 的 cookie 支持进入构建）。在降级这些依赖或
# 去掉 cookie_store 之前，不要把这里改低。
rust-version = "1.88"
license = "Apache-2.0"
authors = ["catlair"]

# ── Lint 基线 ───────────────────────────────────────────────────────────
#
# 各 crate 必须写 `[lints] workspace = true` 才会继承这里。
# 取值原则：只钉住「当前代码已全部满足」的规则，不制造历史欠账。
# 更严的 clippy::pedantic / nursery / missing_debug_implementations 会产出
# 大量既有告警，因此**刻意不启用**，新增代码靠 review 约束。
#
# 详见 docs/conventions.md 第 3 节。
[workspace.lints.rust]
# 纯 Rust 实现，不允许出现 unsafe。
unsafe_code = "forbid"
# 忽略 MustUse 返回值是真实缺陷（例如丢掉的 Result），必须拦住。
unused_must_use = "deny"
# 2018 版习惯用法（如多余的 extern crate、匿名的 trait 对象边界）。
# priority = -1：该组内含 unused_must_use，必须让上面的 deny 优先，
# 否则 clippy 会报 lint_groups_priority（同优先级组与单条规则冲突）。
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = "warn"
# 四大组显式启用：当前代码零告警，作为新增代码的下限。
style = "warn"
suspicious = "warn"
complexity = "warn"
perf = "warn"

[workspace.dependencies]
# ── 内部 crate ───────────────────────────────────────────────────────────
mcloud-core = { path = "crates/mcloud-core" }
mcloud-crypto = { path = "crates/mcloud-crypto" }
mcloud-upstream = { path = "crates/mcloud-upstream" }
mcloud-engine = { path = "crates/mcloud-engine" }
mcloud-tasks = { path = "crates/mcloud-tasks" }
mcloud-store = { path = "crates/mcloud-store" }
mcloud-app = { path = "crates/mcloud-app" }

# ── 异步 ────────────────────────────────────────────────────────────────
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
async-trait = "0.1"
futures = "0.3"

# ── 序列化 ──────────────────────────────────────────────────────────────
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# ── 文本解析 ────────────────────────────────────────────────────────────
# 直播口令提取要**逐字**复刻原 TS 的一批正则。
# ⚠ 选 `regex`（RE2 风格、线性时间）而不是 `fancy-regex`：原 TS 的那一条
#    前瞻正则改成了显式扫描（见 `live_kouling.rs` 模块头），
#    所以这里**不需要**回溯能力 —— 而不需要，就不该引入它。
#    手写扫描器无法覆盖的地方（字符类、多分支）才是它的用武之地。
regex = "1"

# ── 密码学（全部纯 Rust，无 FFI）────────────────────────────────────────
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
aes = "0.8"
cbc = "0.1"
des = "0.8"
cipher = { version = "0.4", features = ["block-padding"] }
base64 = "0.22"
hex = "0.4"
# 口令哈希：WebUI 登录闸用 argon2id。
# 参数与 mcloud 一致（m=19456,t=2,p=1,out=32），这样金标向量能对拍。
argon2 = { version = "0.5", features = ["std"] }
password-hash = { version = "0.5", features = ["std"] }
uuid = { version = "1", features = ["v4"] }

# ── 设备指纹（smid）─────────────────────────────────────────────────────
# RSA 包住 uid（`ep` 字段），gzip 压缩特征体（OS 字节要归一到 19）。
# 两者都是纯 Rust 实现，符合本 crate 零 FFI 的约束。
rsa = "0.9"
flate2 = "1"
# OS 熵源：生产环境的随机源（`OsRandom`）。rsa 已经间接依赖它，
# 这里显式声明是因为我们要**直接**调用，不靠传递依赖。
getrandom = "0.2"

# ── HTTP 客户端 ─────────────────────────────────────────────────────────
reqwest = { version = "0.12", default-features = false, features = ["json", "cookies", "gzip", "rustls-tls"] }

# ── WebSocket 客户端 ────────────────────────────────────────────────────
# 直播弹幕长连（`live_ws_client`）用，本仓第一个 WS 依赖。
#
# TLS 必须与上面的 reqwest **同源**：`rustls-tls-webpki-roots` 走的是同一套
# `rustls` + `webpki-roots`，而 `native-tls` 会拉 openssl（FFI）。
# 本仓的现状是「纯 Rust、零 FFI」，多一套 TLS 栈不只是体积问题：
# 两套实现对同一张证书可能给出不同结论，而"HTTP 能过、WS 过不了"这种不一致
# 排查起来极难。`default-features = false` 关掉 native-tls 默认项，
# 只留 `connect`（`connect_async` 需要）。
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }

# ── Web 服务 ────────────────────────────────────────────────────────────
axum = { version = "0.8", features = ["macros"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tokio-stream = { version = "0.1", features = ["sync"] }
# 前端产物内嵌：单二进制交付，且与后端同源（见 webui-code-guide §7.4）
rust-embed = { version = "8", features = ["interpolate-folder-path"] }
mime_guess = "2"
# 终端登录出码：把二维码画成字符画。
# 关掉默认特性：默认会拉 `image`（重），而我们只要"矩阵 + 字符画"。
qrcode = { version = "0.14", default-features = false }

# ── 可观测 ──────────────────────────────────────────────────────────────
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# ── 时间 / 调度 ─────────────────────────────────────────────────────────
chrono = { version = "0.4", features = ["serde"] }
cron = "0.12"

# ── 错误 ────────────────────────────────────────────────────────────────
thiserror = "2"
anyhow = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
