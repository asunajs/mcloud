# Cargo 配置：**关掉增量编译**。
#
# ── 为什么 ────────────────────────────────────────────────────────────
#
# 这不是"为了快一点"的调优，是**绕开两个真实故障**：
#
# 1. **写入被环境拒绝。** `target/debug/incremental/` 的每一次读写都会被
#    沙箱/杀毒拦掉，构建日志里是十几到二十几条：
#        warning: error copying object file `...rmeta` to incremental directory ... 拒绝访问 (os error 5)
#        warning: failed to garbage collect finalized incremental compilation
#                 session directory ... 拒绝访问 (os error 5)
#    cargo 会重试、等待、超时 —— 冷态下一次 `cargo test` 实测 10 分钟以上
#    还没编完（对比：关掉之后 1 秒内复用既有产物）。
#
# 2. **它会让编译器 ICE（内部错误）。** 实测（rustc 1.96.1）：
#        thread 'rustc' panicked at rustc_metadata/src/rmeta/encoder.rs:2448:51:
#        no entry found for key
#        error: compiler flags: ... -C incremental=[REDACTED]
#        error: could not compile `mcloud-server` (lib)
#    增量缓存目录处于"被拒绝写入 → 状态不完整"的状态时触发。
#    **这个错误看起来像代码问题，实际不是** —— 排查它会浪费大量时间。
#
# ── 代价 ──────────────────────────────────────────────────────────────
#
# 增量编译是为"改一行后快速重建"设计的。关掉之后，改一个 crate 会完整重编
# 那个 crate（而不是只编改动的函数）。在**正常环境**里这是个损失；
# 但在**本机环境下 incremental 根本就没能正常工作过**（见上面两条），
# 所以这里不存在"损失"，只是把一个一直在失败的东西关掉。
#
# 经实测：关掉之后 `cargo test --workspace --no-run` 的复用是正常的，
# 全量门禁热态 30s–1min。
#
# ── 跨环境 ────────────────────────────────────────────────────────────
#
# 这段配置对所有平台生效。若在 Linux/macOS 上跑，可以考虑删掉它换取
# 更快的增量重建 —— **但请在确认该环境没有上述两个问题之后再删**，
# 并把结论补进 `docs/dev-gates.md` 的「跨环境」一节。
[build]
incremental = false
