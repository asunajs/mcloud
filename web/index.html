<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover 是移动端 dock 的硬依赖：删了 iPhone 刘海里会出白条（组件指南 §4.4）。 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>mcloud</title>
    <!--
      首屏加载动画：**必须内联**。打包出来的 CSS 是渲染阻塞的，等它到就已经白屏了；
      这里要的正是"JS 还没执行就先画点东西"，所以样式只能自带、不能引用主题变量
      （daisyUI 的 CSS 变量此刻还没定义），颜色按 data-theme 各写一份。
      ⚠ 它**不改善真实加载速度** —— 应用仍要等 JS 执行完才有内容；改善的是首屏观感与 FCP。
    -->
    <style>
      #boot { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none; }
      #boot i {
        width: 28px; height: 28px; border: 3px solid #d4d4d8; border-top-color: #4f46e5;
        border-radius: 50%; animation: boot-spin .8s linear infinite;
      }
      html[data-theme="dark"] #boot i { border-color: #3f3f46; border-top-color: #a5b4fc; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      /* 动效敏感的用户不要转圈 */
      @media (prefers-reduced-motion: reduce) { #boot i { animation-duration: 2.4s; } }
      /*
        应用一渲染出内容就撤掉它。用 :has() 是**零 JS** 的判据：
        `#app` 一有子节点就隐藏，不必等 main.ts 跑到那一行（少一帧转圈压在新界面上）。
        main.ts 里另有一道 `remove()` 兜底 —— 老浏览器没有 :has() 时也能收掉。
      */
      body:has(#app > *) #boot { display: none; }

      /*
        挂不上时的兜底（见下面那段脚本）：把转圈换成一句能读懂的话。
        转圈本身没错，错的是**故障时还在转** —— chunk 404 / 断网 / 顶层抛错时，
        用户只看到"卡住了"，控制台里那条真正的原因被完全挡住。
      */
      #boot .boot-fail { display: none; max-width: 20rem; text-align: center; line-height: 1.9; }
      #boot .boot-fail b { font-size: 15px; }
      #boot .boot-fail span { font-size: 13px; opacity: .75; }
      body[data-boot-failed] #boot i { display: none; }
      body[data-boot-failed] #boot .boot-fail { display: block; }
    </style>
  </head>
  <body class="bg-base-200">
    <script>
      // 在首次绘制前定下 data-theme，避免"先浅后深"的一闪（FOUC）。
      // 必须内联、必须同步 —— 一旦被异步加载就失去意义。
      // ⚠ 逻辑与 src/ui/theme.ts 保持一致（改一处要同步另一处）：
      //   localStorage 优先，其次跟随系统偏好。
      try {
        var saved = localStorage.getItem('mcloud-theme')
        var theme = saved === 'light' || saved === 'dark'
          ? saved
          : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        document.documentElement.setAttribute('data-theme', theme)
      } catch (e) {
        // localStorage 可能被隐私模式禁用 —— 退化成默认浅色，不能让脚本报错白屏
        document.documentElement.setAttribute('data-theme', 'light')
      }
    </script>
    <div id="app"></div>
    <!-- 首屏占位：在 #app 之外，所以不影响任何 #app 子树比对/截图 -->
    <div id="boot" role="status" aria-label="加载中"><i></i></div>
    <script>
      /*
       * 首屏兜底：应用没挂上时**别让它永远转圈**。
       *
       * 判据是 `#app` 有没有子节点 —— 一旦挂上，这些回调就什么都不做，
       * 所以它不会误伤正常流程（`main.ts` 挂载后会把 #boot 整个 remove）。
       * 三段触发源：脚本加载失败（chunk 404 / 断网，error 要 capture 阶段才收得到
       * 资源错误）、运行时抛错、以及 12 秒超时（应用很小，正常远快于此）。
       */
      (function () {
        function fail(why) {
          if (document.querySelector('#app > *')) return
          var boot = document.getElementById('boot')
          if (!boot || boot.getAttribute('data-failed')) return
          boot.setAttribute('data-failed', '1')
          boot.setAttribute('aria-label', '加载失败')
          document.body.setAttribute('data-boot-failed', '')
          boot.innerHTML = '<div class="boot-fail"><b>页面没能加载</b><br><span>（' + why + '）<br>请刷新重试；若一直如此，看控制台里第一条报错</span></div>'
        }
        window.addEventListener('error', function () { fail('脚本加载失败') }, true)
        window.addEventListener('unhandledrejection', function () { fail('脚本执行出错') })
        setTimeout(function () { fail('加载超时') }, 12000)
      })()
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
